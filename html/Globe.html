<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe</title>
</head>

<script src="/html/Globe_files/globe.gl"></script>

<body>
  <div id="globeViz"></div>

  <script>
    fetch('/html/Globe_files/custom.geo.json')
    .then(res => res.json())
    .then(countries => {
        // 预先给每个国家分配一个固定颜色，避免每次重绘时随机变色
        countries.features.forEach(f => {
        f.__color = `#${Math.round(Math.random() * Math.pow(2, 24))
            .toString(16)
            .padStart(6, '0')}`;
        });

        const world = new Globe(document.getElementById('globeViz'))
        .globeImageUrl('/html/Globe_files/earth-dark.jpg')
        .polygonsData(countries.features)

        // 稍微抬高，避免和地球表面重叠闪烁
        .polygonAltitude(0.01)

        // 国家面填充色
        .polygonCapColor(f => f.__color)

        // 侧面颜色
        .polygonSideColor(() => 'rgba(0, 0, 0, 0.15)')

        // 边界线颜色
        .polygonStrokeColor(() => '#111')

        // 地图平滑程度
        .polygonCapCurvatureResolution(1)
        
        // 悬停标签
        .polygonLabel(({ properties: d }) => `
            <b>${d.name_zh}</b> <br />
            <b>${d.name_en}</b>
        `);
    });
  </script>
</body>
